[project]
name = "checkmeout-backend"
version = "0.1.0"
description = "CheckMeOut API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.2",
    "pydantic-settings==2.16.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.2",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Errors, pyflakes, import order, modern syntax, common bugs, security checks.
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Plain `assert` is how pytest tests are written.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
